<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at 20% 20%, #7f5af0 0, transparent 40%),
                radial-gradient(circle at 80% 80%, #2cb67d 0, transparent 40%),
                #16161a;
  }
  .calc {
    width: 320px;
    padding: 24px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .display {
    color: #fff;
    text-align: right;
    padding: 16px 8px 24px;
    overflow-wrap: anywhere;
  }
  #expr { min-height: 1.4em; font-size: 1rem; opacity: 0.6; }
  #result { font-size: 2.8rem; font-weight: 300; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  button {
    height: 60px;
    border: none;
    border-radius: 18px;
    font-size: 1.4rem;
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    cursor: pointer;
    transition: transform 0.08s, background 0.2s;
  }
  button:hover { background: rgba(255, 255, 255, 0.2); }
  button:active { transform: scale(0.94); }
  button:focus-visible { outline: 2px solid #fff; }
  .op { background: #7f5af0; }
  .op:hover { background: #9373ff; }
  .fn { color: #2cb67d; }
  .eq { background: #2cb67d; grid-column: span 2; }
  .eq:hover { background: #3fd393; }
</style>
</head>
<body>
<main class="calc">
  <div class="display" aria-live="polite">
    <div id="expr"></div>
    <div id="result">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="Backspace" aria-label="Delete">⌫</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="/" aria-label="Divide">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*" aria-label="Multiply">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-" aria-label="Minus">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Plus">+</button>
    <button data-k="0">0</button><button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
</main>
<script>
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');
  let expr = '';

  const pretty = s => s.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');

  function evaluate(s) {
    // Input is restricted to digits/operators below, so Function is safe here.
    const v = Function(`return (${s.replace(/%/g, '/100')})`)();
    return Number.isFinite(v) ? +v.toPrecision(12) : 'Error';
  }

  function press(k) {
    if (k === 'C' || k === 'Escape') expr = '';
    else if (k === 'Backspace') expr = expr.slice(0, -1);
    else if (k === '=' || k === 'Enter') {
      if (!expr) return;
      try { expr = String(evaluate(expr)); } catch { expr = 'Error'; }
      exprEl.textContent = '';
      resultEl.textContent = expr;
      if (expr === 'Error') expr = '';
      return;
    } else if (/^[\d.+\-*/%]$/.test(k)) {
      if (/[+\-*/.]$/.test(expr) && /[+\-*/.]/.test(k)) expr = expr.slice(0, -1); // replace trailing operator
      expr += k;
    } else return;

    exprEl.textContent = pretty(expr);
    try { resultEl.textContent = expr ? evaluate(expr) : 0; } catch { /* incomplete expression */ }
  }

  document.querySelector('.keys').addEventListener('click', e => {
    if (e.target.dataset.k) press(e.target.dataset.k);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') e.preventDefault();
    press(e.key);
  });
</script>
</body>
</html>
