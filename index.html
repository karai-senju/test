<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at 20% 20%, #7f5af0 0, transparent 40%),
                radial-gradient(circle at 80% 80%, #2cb67d 0, transparent 40%),
                #16161a;
  }
  .calc {
    width: 400px;
    padding: 24px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .display {
    color: #fff;
    text-align: right;
    padding: 16px 8px 24px;
    overflow-wrap: anywhere;
  }
  #expr { min-height: 1.4em; font-size: 1rem; opacity: 0.6; }
  #result { font-size: 2.8rem; font-weight: 300; }
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  button {
    height: 52px;
    border: none;
    border-radius: 18px;
    font-size: 1.25rem;
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    cursor: pointer;
    transition: transform 0.08s, background 0.2s;
  }
  button:hover { background: rgba(255, 255, 255, 0.2); }
  button:active { transform: scale(0.94); }
  button:focus-visible { outline: 2px solid #fff; }
  .op { background: #7f5af0; }
  .op:hover { background: #9373ff; }
  .fn { color: #2cb67d; }
  .eq { background: #2cb67d; grid-column: span 2; }
  .eq:hover { background: #3fd393; }
  .sci { font-size: 1rem; color: #cfc6ff; background: rgba(127, 90, 240, 0.15); }
</style>
</head>
<body>
<main class="calc">
  <div class="display" aria-live="polite">
    <div id="expr"></div>
    <div id="result">0</div>
  </div>
  <div class="keys">
    <button class="sci" data-k="mode" id="mode" aria-label="Toggle degrees or radians">DEG</button>
    <button class="sci" data-k="sin">sin</button>
    <button class="sci" data-k="cos">cos</button>
    <button class="sci" data-k="tan">tan</button>
    <button class="sci" data-k="pi" aria-label="Pi">π</button>
    <button class="sci" data-k="ln">ln</button>
    <button class="sci" data-k="log">log</button>
    <button class="sci" data-k="sqrt" aria-label="Square root">√</button>
    <button class="sci" data-k="sq" aria-label="Square">x²</button>
    <button class="sci" data-k="^" aria-label="Power">xʸ</button>
    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="Backspace" aria-label="Delete">⌫</button>
    <button class="fn" data-k="(">(</button>
    <button class="fn" data-k=")">)</button>
    <button class="op" data-k="/" aria-label="Divide">÷</button>
    <button class="sci" data-k="!" aria-label="Factorial">n!</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*" aria-label="Multiply">×</button>
    <button class="sci" data-k="e" aria-label="Euler's number">ℯ</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-" aria-label="Minus">−</button>
    <button class="fn" data-k="%">%</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Plus">+</button>
    <button class="sci" data-k="inv" aria-label="Reciprocal">1/x</button>
    <button data-k="0">0</button><button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
</main>
<script>
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');
  let expr = '';

  const pretty = s => s.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');

  let deg = true;
  const tokens = { sin: 'sin(', cos: 'cos(', tan: 'tan(', ln: 'ln(', log: 'log(', sqrt: '√(', pi: 'π', e: 'ℯ', sq: '^2', inv: '^(-1)' };
  const fact = n => n < 0 || n % 1 ? NaN : n > 170 ? Infinity : n < 2 ? 1 : n * fact(n - 1);
  // Round so sin(180°) is 0, not 1.2e-16.
  const trig = f => x => Math.round(f(deg ? x * Math.PI / 180 : x) * 1e15) / 1e15;

  function evaluate(s) {
    const open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
    s = (s + ')'.repeat(Math.max(0, open)))
      .replace(/([\d.)πℯ!])(?=[(sctl√πℯ])/g, '$1*') // implicit multiply: 2π, 3sin(…), (1)(2)
      .replace(/([)πℯ!])(?=[\d.])/g, '$1*')
      .replace(/([\d.]+)!/g, 'fact($1)')
      .replace(/%/g, '/100').replace(/\^/g, '**')
      .replace(/π/g, 'PI').replace(/ℯ/g, 'E').replace(/√/g, 'sqrt');
    // Input is restricted to the tokens above, so Function is safe here.
    const v = Function('sin', 'cos', 'tan', 'ln', 'log', 'sqrt', 'fact', 'PI', 'E', `return (${s})`)(
      trig(Math.sin), trig(Math.cos), trig(Math.tan), Math.log, Math.log10, Math.sqrt, fact, Math.PI, Math.E);
    return Number.isFinite(v) ? +v.toPrecision(12) : 'Error';
  }

  function press(k) {
    if (k === 'mode') {
      deg = !deg;
      document.getElementById('mode').textContent = deg ? 'DEG' : 'RAD';
    } else if (k === 'C' || k === 'Escape') expr = '';
    else if (k === 'Backspace') expr = expr.replace(/([a-z√]+\(|.)$/, ''); // drop whole "sin(" at once
    else if (k === '=' || k === 'Enter') {
      if (!expr) return;
      try { expr = String(evaluate(expr)); } catch { expr = 'Error'; }
      exprEl.textContent = '';
      resultEl.textContent = expr;
      if (expr === 'Error') expr = '';
      return;
    } else if (k in tokens) expr += tokens[k];
    else if (/^[\d.+\-*/%^()!]$/.test(k)) {
      if (/[+\-*/^.]$/.test(expr) && /[+\-*/^.]/.test(k)) expr = expr.slice(0, -1); // replace trailing operator
      expr += k;
    } else return;

    exprEl.textContent = pretty(expr);
    try { resultEl.textContent = expr ? evaluate(expr) : 0; } catch { /* incomplete expression */ }
  }

  document.querySelector('.keys').addEventListener('click', e => {
    if (e.target.dataset.k) press(e.target.dataset.k);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') e.preventDefault();
    press(e.key);
  });
</script>
</body>
</html>
